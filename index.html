<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#4CAF50">
    <title>用药提醒 - 您的健康小助手</title>
    <link rel="stylesheet" href="src/css/styles.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1>💊 用药提醒</h1>
            <div class="date-display" id="currentDate"></div>
        </header>

        <div class="view active" id="homeView">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value" id="totalMedications">0</div>
                    <div class="stat-label">药品数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="todayCompleted">0</div>
                    <div class="stat-label">今日已服</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="todayPending">0</div>
                    <div class="stat-label">待服用</div>
                </div>
            </div>

            <section class="section">
                <h2 class="section-title">今日提醒</h2>
                <div id="todayReminders">
                </div>
            </section>

            <section class="section">
                <h2 class="section-title">我的药品</h2>
                <div id="medicationList">
                </div>
            </section>
        </div>

        <div class="view" id="recordsView">
            <section class="section">
                <h2 class="section-title">服药记录</h2>
                <div id="historyList">
                </div>
            </section>
        </div>

        <div class="view" id="settingsView">
            <section class="section">
                <h2 class="section-title">设置</h2>

                <div class="settings-group">
                    <div class="settings-item" id="notificationSettings">
                        <div class="settings-label">
                            <div class="settings-icon" style="background-color: #E8F5E9;">🔔</div>
                            <div class="settings-text">浏览器通知提醒</div>
                        </div>
                        <div class="toggle-switch" id="notificationToggle"></div>
                    </div>
                    <div id="notificationStatusContainer" class="notification-settings-section">
                        <div class="notification-status" id="notificationStatus">
                            <span id="notificationStatusIcon"></span>
                            <span id="notificationStatusText"></span>
                        </div>
                    </div>
                </div>

                

                <div class="settings-group">
                    <div class="settings-item" id="exportData">
                        <div class="settings-label">
                            <div class="settings-icon" style="background-color: #E3F2FD;">📤</div>
                            <div class="settings-text">导出数据</div>
                        </div>
                        <div class="settings-arrow">›</div>
                    </div>

                    <div class="settings-item" id="importData">
                        <div class="settings-label">
                            <div class="settings-icon" style="background-color: #FFF3E0;">📥</div>
                            <div class="settings-text">导入数据</div>
                        </div>
                        <div class="settings-arrow">›</div>
                    </div>
                </div>
            </section>

            <section class="section">
                <h2 class="section-title">统计</h2>
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-value" id="weekCompliance">0%</div>
                        <div class="stat-label">本周遵医率</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="monthLogs">0</div>
                        <div class="stat-label">本月记录</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="totalLogs">0</div>
                        <div class="stat-label">总记录数</div>
                    </div>
                </div>
            </section>

            <section class="section">
                <h2 class="section-title">关于</h2>
                <div class="settings-group">
                    <div class="settings-item">
                        <div class="settings-label">
                            <div class="settings-icon" style="background-color: #F3E5F5;">ℹ️</div>
                            <div class="settings-text">版本</div>
                        </div>
                        <div style="color: var(--text-secondary);">1.0.0</div>
                    </div>
                    <div class="settings-item" id="clearData">
                        <div class="settings-label">
                            <div class="settings-icon" style="background-color: #FFEBEE; color: var(--danger-color);">🗑️</div>
                            <div class="settings-text" style="color: var(--danger-color);">清除所有数据</div>
                        </div>
                        <div class="settings-arrow">›</div>
                    </div>
                </div>
            </section>
        </div>

        <nav class="bottom-nav">
            <button class="nav-item active" data-view="home">
                <span class="nav-icon">🏠</span>
                <span class="nav-label">首页</span>
            </button>
            <button class="nav-item" data-view="records">
                <span class="nav-icon">📋</span>
                <span class="nav-label">记录</span>
            </button>
            <button class="nav-item" data-view="settings">
                <span class="nav-icon">⚙️</span>
                <span class="nav-label">我的</span>
            </button>
        </nav>

        <button class="fab" id="addMedicationBtn">+</button>
    </div>

    <div class="modal-overlay" id="medicationModal">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle">添加药品</h2>
                <button class="modal-close" id="closeModal">×</button>
            </div>

            <form id="medicationForm">
                <input type="hidden" id="medicationId">

                <div class="form-tabs">
                    <button type="button" class="form-tab active" data-tab="manual">📝 手动输入</button>
                    <button type="button" class="form-tab" data-tab="smart">🤖 智能解析</button>
                    <button type="button" class="form-tab" data-tab="llm">🧠 LLM 解析</button>
                </div>

                <div class="tab-content active" id="manualTab">
                    <div class="form-group">
                        <label class="form-label" for="medicationName">药品名称 *</label>
                        <input type="text" class="form-input" id="medicationName" placeholder="例如：阿司匹林" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="medicationDosage">剂量</label>
                        <input type="text" class="form-input" id="medicationDosage" placeholder="例如：100mg">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="medicationFrequency">服用频率</label>
                        <select class="form-input form-select" id="medicationFrequency">
                            <option value="daily">每天</option>
                            <option value="twice_daily">每天两次</option>
                            <option value="three_times">每天三次</option>
                            <option value="weekly">每周</option>
                            <option value="as_needed">按需服用</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label">服用时间</label>
                        <div class="time-picker-container" id="timePicker">
                            <button type="button" class="time-chip" data-time="08:00">08:00</button>
                            <button type="button" class="time-chip" data-time="12:00">12:00</button>
                            <button type="button" class="time-chip" data-time="18:00">18:00</button>
                        </div>
                        <button type="button" class="btn btn-secondary btn-sm mt-20" id="addTimeBtn">+ 添加时间</button>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="medicationMethod">服用方式</label>
                        <select class="form-input form-select" id="medicationMethod">
                            <option value="口服">口服</option>
                            <option value="饭后服用">饭后服用</option>
                            <option value="饭前服用">饭前服用</option>
                            <option value="空腹服用">空腹服用</option>
                            <option value="随餐服用">随餐服用</option>
                            <option value="外用">外用</option>
                            <option value="含服">含服</option>
                            <option value="注射">注射</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="medicationDays">服用日期</label>
                        <div class="checkbox-group" id="daysPicker">
                            <div class="checkbox-item selected" data-day="1">周一</div>
                            <div class="checkbox-item selected" data-day="2">周二</div>
                            <div class="checkbox-item selected" data-day="3">周三</div>
                            <div class="checkbox-item selected" data-day="4">周四</div>
                            <div class="checkbox-item selected" data-day="5">周五</div>
                            <div class="checkbox-item selected" data-day="6">周六</div>
                            <div class="checkbox-item selected" data-day="0">周日</div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="medicationNotes">备注</label>
                        <textarea class="form-input form-textarea" id="medicationNotes" placeholder="添加备注信息..."></textarea>
                    </div>
                </div>

                <div class="tab-content" id="smartTab">
                    <div class="smart-parse-section">
                        <p class="form-hint" style="margin-bottom: 12px;">输入药品说明、医嘱或口头描述，系统将自动解析并填充表单</p>
                        <div class="form-group">
                            <label class="form-label" for="medicationDescription">药品描述</label>
                            <textarea class="form-input form-textarea" id="medicationDescription" placeholder="例如：&#10;阿司匹林 100mg&#10;每日3次，每次1片&#10;饭后服用&#10;08:00 12:00 18:00"></textarea>
                        </div>
                        <button type="button" class="btn btn-primary btn-block" id="parseDescriptionBtn">
                            🤖 智能解析
                        </button>

                        <div class="parse-result" id="parseResult" style="display: none;">
                            <div class="parse-result-header">
                                <span>✨ 解析结果</span>
                                <button type="button" class="btn btn-sm btn-secondary" id="applyParseBtn">应用此结果</button>
                            </div>
                            <div class="parse-result-content" id="parseResultContent"></div>
                        </div>
                    </div>
                </div>

                <div class="tab-content" id="llmTab">
                    <div class="smart-parse-section">
                        <p class="form-hint" style="margin-bottom: 12px;">使用 AI 智能识别药品信息，支持文字描述和图片</p>

                        <div class="form-group">
                            <label class="form-label">文字描述</label>
                            <textarea class="form-input form-textarea" id="llmDescription" placeholder="输入药品描述，例如：&#10;阿莫西林胶囊 500mg&#10;每天三次 每次一粒&#10;饭后服用"></textarea>
                        </div>
                        <button type="button" class="btn btn-primary btn-block" id="llmParseBtn">
                            🧠 LLM 智能解析
                        </button>

                        <div style="text-align: center; margin: 16px 0; color: var(--text-secondary);">— 或 —</div>

                        <div class="form-group">
                            <label class="form-label">上传药品图片</label>
                            <div style="border: 2px dashed var(--border-color); border-radius: var(--border-radius); padding: 20px; text-align: center; cursor: pointer;" id="imageUploadArea">
                                <div style="font-size: 2rem; margin-bottom: 8px;">📷</div>
                                <div style="color: var(--text-secondary);">点击上传药品图片</div>
                                <input type="file" id="imageUpload" accept="image/*" style="display: none;">
                            </div>
                            <div id="imagePreview" style="display: none; margin-top: 12px; text-align: center;">
                                <img id="previewImage" style="max-width: 100%; max-height: 200px; border-radius: var(--border-radius);">
                                <button type="button" class="btn btn-secondary btn-sm" id="clearImageBtn" style="margin-top: 8px;">清除图片</button>
                            </div>
                        </div>

                        <div id="llmLoading" style="display: none; text-align: center; padding: 20px;">
                            <div class="loading"></div>
                            <div style="margin-top: 8px; color: var(--text-secondary);">AI 正在分析中...</div>
                        </div>

                        <div class="parse-result" id="llmParseResult" style="display: none;">
                            <div class="parse-result-header">
                                <span>✨ LLM 解析结果</span>
                                <button type="button" class="btn btn-sm btn-secondary" id="applyLLMResultBtn">应用此结果</button>
                            </div>
                            <div class="parse-result-content" id="llmParseResultContent"></div>
                        </div>
                    </div>
                </div>

                <div class="action-buttons">
                    <button type="button" class="btn btn-secondary" id="cancelBtn">取消</button>
                    <button type="submit" class="btn btn-primary" id="saveBtn">保存</button>
                </div>
            </form>
        </div>
    </div>

    <div class="modal-overlay" id="confirmModal">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title" id="confirmTitle">确认操作</h2>
                <button class="modal-close" id="closeConfirmModal">×</button>
            </div>
            <p id="confirmMessage" style="margin-bottom: 20px; color: var(--text-secondary);"></p>
            <div class="action-buttons">
                <button type="button" class="btn btn-secondary" id="confirmCancel">取消</button>
                <button type="button" class="btn btn-danger" id="confirmOk">确认</button>
            </div>
        </div>
    </div>

    <input type="file" id="fileInput" accept=".json" style="display: none;">

    <div class="toast" id="toast"></div>

    <script type="module" src="src/js/app.js"></script>
</body>
</html>

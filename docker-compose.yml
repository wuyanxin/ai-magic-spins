version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: medreminder-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - medreminder-network

  redis:
    image: redis:7-alpine
    container_name: medreminder-redis
    ports:
      - "6379:6379"
    networks:
      - medreminder-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medreminder-backend
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://admin:password@mongodb:27017/medreminder
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-your-secret-key}
      PORT: 5000
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
      - redis
    networks:
      - medreminder-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medreminder-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - medreminder-network

volumes:
  mongodb_data:

networks:
  medreminder-network:
    driver: bridge
